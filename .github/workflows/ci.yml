name: Reproduction smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install .
      - name: Verify assets and run implementation tests
        run: |
          python -m pagr verify
          python -m unittest discover -s tests -v
      - name: One full baseline replay (not a new-seed experiment)
        run: python -m pagr replay --task arm --seed 18001 --method am_adam --output runs/ci-smoke
      - name: Check finite outputs without asserting cross-platform bitwise equality
        run: |
          python -c "import json, math; d=json.load(open('runs/ci-smoke/comparison.json')); assert all(math.isfinite(x) for x in d['final'].values()); print({k:d[k] for k in ['cost_error','max_final_metric_error','exact']})"
