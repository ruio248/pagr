[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pagr-research"
version = "0.1.0a1"
description = "Research artifacts for terminal-gradient reliability and control; exploratory, not a validated new algorithm"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "ruio248"}]
dependencies = [
  "torch==2.9.1",
  "numpy==2.3.5",
  "scipy==1.16.3",
]

[project.optional-dependencies]
notebook = [
  "matplotlib==3.10.8",
  "pandas==2.3.3",
  "nbformat==5.10.4",
  "nbclient==0.10.4",
  "ipykernel>=6,<8",
]

[project.scripts]
pagr = "pagr.__main__:main"

[project.urls]
Repository = "https://github.com/ruio248/pagr"
Issues = "https://github.com/ruio248/pagr/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pagr"]

[tool.setuptools.package-data]
pagr = ["assets/**/*", "assets/manifest.json", "_legacy/**/*.py"]
